name: Engine tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check src/audio.js
          node --check src/main.js
          node --check src/renderer.js
          node --check src/rhythm.js
      - name: Run rhythm engine tests
        run: npm test
